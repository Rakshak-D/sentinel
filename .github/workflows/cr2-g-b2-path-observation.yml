name: CR2-G-B2 read-only path observation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe-path:
    runs-on: windows-2025
    timeout-minutes: 3
    steps:
      - name: Observe historical HOST_PREFLIGHT expression
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $script:serviceRoot = "C:\ProgramData\SentinelCR2GB2"
          $script:historicalSourceSha = "a54fcd844685b13c0963b1a785c4fe3b1976b229"
          $script:historicalSourceLine = 321
          $script:operationIds = @(
            "ROOT_LITERAL_VALIDATION", "GET_FULL_PATH", "NORMALIZED_PATH_COMPARISON",
            "SPLIT_PATH_PARENT", "PARENT_EXISTS", "GET_ITEM_LITERAL_NO_FORCE",
            "PARENT_ATTRIBUTE_FLAGS", "ORIGINAL_COMPOUND_EXPRESSION",
            "GET_ITEM_LITERAL_WITH_FORCE", "FORCE_PARENT_ATTRIBUTE_FLAGS"
          )
          $script:observations = [System.Collections.Generic.List[object]]::new()
          $script:statuses = @{}
          $script:exceptionTypes = @{
            "System.IO.IOException" = "IO"
            "System.IO.DirectoryNotFoundException" = "IO"
            "System.IO.FileNotFoundException" = "IO"
            "System.IO.PathTooLongException" = "IO"
            "System.IO.DriveNotFoundException" = "IO"
            "System.UnauthorizedAccessException" = "ACCESS"
            "System.Security.SecurityException" = "ACCESS"
            "System.ArgumentException" = "ARGUMENT"
            "System.Management.Automation.ItemNotFoundException" = "IO"
            "System.Management.Automation.DriveNotFoundException" = "IO"
            "System.Management.Automation.PSArgumentException" = "ARGUMENT"
          }
          $script:resolvedRoot = $null
          $script:normalizedMatches = $null
          $script:parentPath = $null
          $script:parentExists = $null
          $script:parentItem = $null
          $script:attributes = [ordered]@{ directory = $null; reparse_point = $null }
          $script:forceParentItem = $null
          $script:forceAttributes = [ordered]@{ directory = $null; hidden = $null; system = $null; reparse_point = $null }
          $script:differential = "INCONCLUSIVE"
          $script:compoundGuardTriggered = $null

          function Get-SafeErrorDetail {
            param([System.Management.Automation.ErrorRecord]$Record)
            $type = $Record.Exception.GetType().FullName
            $category = $script:exceptionTypes[$type]
            if ($null -eq $category) { $type = "OTHER"; $category = "OTHER" }
            $errorId = [string]$Record.FullyQualifiedErrorId
            if ($errorId -notmatch '^[A-Za-z][A-Za-z0-9_.]{0,63}(,[A-Za-z][A-Za-z0-9_.]{0,63})?$') { $errorId = "UNLISTED" }
            $hresult = ([int64]$Record.Exception.HResult) -band [int64]4294967295
            return [ordered]@{
              exception_type = $type
              category = $category
              hresult = ("0x{0:X8}" -f $hresult)
              error_identifier = $errorId
            }
          }

          function Invoke-Probe {
            param(
              [string]$Id,
              [scriptblock]$Action,
              [ValidateSet("PASS", "FALSE")][string]$TrueStatus = "PASS",
              [ValidateSet("PASS", "FALSE")][string]$FalseStatus = "FALSE"
            )
            $value = $null
            $detail = $null
            try {
              $value = & $Action
              $status = if ($value -is [bool]) { if ($value) { $TrueStatus } else { $FalseStatus } } else { "PASS" }
            }
            catch {
              $status = "ERROR"
              $detail = Get-SafeErrorDetail -Record $_
            }
            $script:statuses[$Id] = $status
            $script:observations.Add([ordered]@{
              id = $Id
              status = $status
              value = $value
              exception_type = $detail.exception_type
              exception_category = $detail.category
              hresult = $detail.hresult
              error_identifier = $detail.error_identifier
            }) | Out-Null
            return $value
          }

          try {
            $script:literalMatches = [string]::Equals($script:serviceRoot, "C:\ProgramData\SentinelCR2GB2", [System.StringComparison]::Ordinal)
            Invoke-Probe -Id "ROOT_LITERAL_VALIDATION" -Action { $script:literalMatches } | Out-Null

            if ($script:statuses["ROOT_LITERAL_VALIDATION"] -eq "PASS") {
              Invoke-Probe -Id "GET_FULL_PATH" -Action {
                $script:resolvedRoot = [IO.Path]::GetFullPath($script:serviceRoot)
                return $true
              } | Out-Null

              if ($script:statuses["GET_FULL_PATH"] -eq "PASS") {
                Invoke-Probe -Id "NORMALIZED_PATH_COMPARISON" -Action {
                  $script:normalizedMatches = [string]::Equals($script:resolvedRoot, $script:serviceRoot, [System.StringComparison]::Ordinal)
                  $script:normalizedMatches
                } | Out-Null
              }

              Invoke-Probe -Id "SPLIT_PATH_PARENT" -Action {
                $script:parentPath = Split-Path $script:serviceRoot -Parent
                -not [string]::IsNullOrEmpty($script:parentPath)
              } | Out-Null

              if ($script:statuses["SPLIT_PATH_PARENT"] -eq "PASS") {
                Invoke-Probe -Id "PARENT_EXISTS" -Action {
                  $script:parentExists = [bool](Test-Path -LiteralPath $script:parentPath -PathType Container)
                  $script:parentExists
                } | Out-Null

                Invoke-Probe -Id "GET_ITEM_LITERAL_NO_FORCE" -Action {
                  $script:parentItem = Get-Item -LiteralPath $script:parentPath
                  $null -ne $script:parentItem
                } | Out-Null

                if ($script:statuses["GET_ITEM_LITERAL_NO_FORCE"] -eq "PASS") {
                  Invoke-Probe -Id "PARENT_ATTRIBUTE_FLAGS" -Action {
                    $script:attributes.directory = [bool]($script:parentItem.Attributes -band [IO.FileAttributes]::Directory)
                    $script:attributes.reparse_point = [bool]($script:parentItem.Attributes -band [IO.FileAttributes]::ReparsePoint)
                    -not $script:attributes.reparse_point
                  } | Out-Null
                }

                # Read-only comparison; -Force does not bypass filesystem ACLs.
                Invoke-Probe -Id "GET_ITEM_LITERAL_WITH_FORCE" -Action {
                  $script:forceParentItem = Get-Item -LiteralPath $script:parentPath -Force
                  $null -ne $script:forceParentItem
                } | Out-Null

                if ($script:statuses["GET_ITEM_LITERAL_WITH_FORCE"] -eq "PASS") {
                  Invoke-Probe -Id "FORCE_PARENT_ATTRIBUTE_FLAGS" -Action {
                    $script:forceAttributes.directory = [bool]($script:forceParentItem.Attributes -band [IO.FileAttributes]::Directory)
                    $script:forceAttributes.hidden = [bool]($script:forceParentItem.Attributes -band [IO.FileAttributes]::Hidden)
                    $script:forceAttributes.system = [bool]($script:forceParentItem.Attributes -band [IO.FileAttributes]::System)
                    $script:forceAttributes.reparse_point = [bool]($script:forceParentItem.Attributes -band [IO.FileAttributes]::ReparsePoint)
                    -not $script:forceAttributes.reparse_point
                  } | Out-Null
                }
              }

              if ($script:statuses["GET_FULL_PATH"] -eq "PASS") {
                Invoke-Probe -Id "ORIGINAL_COMPOUND_EXPRESSION" -Action {
                  if ($script:resolvedRoot -ne $script:serviceRoot -or (Get-Item -LiteralPath (Split-Path $script:serviceRoot -Parent)).Attributes -band [IO.FileAttributes]::ReparsePoint) {
                    $script:compoundGuardTriggered = $true
                  }
                  else {
                    $script:compoundGuardTriggered = $false
                  }
                  -not $script:compoundGuardTriggered
                } | Out-Null
              }
            }

            $notRun = @($script:operationIds | Where-Object { -not $script:statuses.ContainsKey($_) })
            $compound = @($script:observations | Where-Object { $_.id -eq "ORIGINAL_COMPOUND_EXPRESSION" }) | Select-Object -First 1
            if ($null -eq $compound) { $determination = "INCONCLUSIVE" }
            elseif ($compound.status -eq "ERROR" -and $compound.exception_category -eq "IO") { $determination = "REPRODUCED" }
            elseif ($compound.status -eq "ERROR") { $determination = "INCONCLUSIVE" }
            else { $determination = "NOT_REPRODUCED" }

            if ($script:statuses["GET_ITEM_LITERAL_NO_FORCE"] -eq "ERROR" -and
                $script:statuses["GET_ITEM_LITERAL_WITH_FORCE"] -eq "PASS" -and
                $script:forceAttributes.directory -eq $true -and
                $script:forceAttributes.hidden -eq $true -and
                $script:forceAttributes.reparse_point -eq $false) {
              $script:differential = "HIDDEN_ITEM_FILTERING_SUPPORTED"
            }
            elseif ($script:statuses["GET_ITEM_LITERAL_NO_FORCE"] -eq "PASS") {
              $script:differential = "ORIGINAL_NOT_REPRODUCED"
            }

            $report = [ordered]@{
              schema_version = "sentinel.cr2-g-b2-path-observation.v2"
              historical_source_sha = $script:historicalSourceSha
              historical_source_line = $script:historicalSourceLine
              prior_diagnostic_run_id = 44332024762
              runner_metadata = [ordered]@{
                requested_image = "windows-2025"
                os_platform = [Environment]::OSVersion.Platform.ToString()
                os_version = [Environment]::OSVersion.Version.ToString()
                architecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
                powershell_version = $PSVersionTable.PSVersion.ToString()
              }
              operations = @($script:observations.ToArray())
              not_run_operation_ids = $notRun
              observed_flags = [ordered]@{
                normalized_matches_literal = $script:normalizedMatches
                parent_exists = $script:parentExists
                parent_is_directory = $script:attributes.directory
                parent_is_reparse_point = $script:attributes.reparse_point
                force_parent_is_directory = $script:forceAttributes.directory
                force_parent_is_hidden = $script:forceAttributes.hidden
                force_parent_is_system = $script:forceAttributes.system
                force_parent_is_reparse_point = $script:forceAttributes.reparse_point
                compound_guard_triggered = $script:compoundGuardTriggered
              }
              final_determination = $determination
              differential_determination = $script:differential
              service_isolation = "NOT_ASSESSED"
            }
          }
          catch {
            $report = [ordered]@{
              schema_version = "sentinel.cr2-g-b2-path-observation.v2"
              historical_source_sha = $script:historicalSourceSha
              historical_source_line = $script:historicalSourceLine
              prior_diagnostic_run_id = 44332024762
              operations = @($script:observations.ToArray())
              not_run_operation_ids = @($script:operationIds | Where-Object { -not $script:statuses.ContainsKey($_) })
              observed_flags = [ordered]@{
                normalized_matches_literal = $script:normalizedMatches
                parent_exists = $script:parentExists
                parent_is_directory = $script:attributes.directory
                parent_is_reparse_point = $script:attributes.reparse_point
                force_parent_is_directory = $script:forceAttributes.directory
                force_parent_is_hidden = $script:forceAttributes.hidden
                force_parent_is_system = $script:forceAttributes.system
                force_parent_is_reparse_point = $script:forceAttributes.reparse_point
                compound_guard_triggered = $script:compoundGuardTriggered
              }
              final_determination = "INCONCLUSIVE"
              differential_determination = $script:differential
              report_error = Get-SafeErrorDetail -Record $_
              service_isolation = "NOT_ASSESSED"
            }
          }

          [Console]::Out.WriteLine(($report | ConvertTo-Json -Depth 8 -Compress))
