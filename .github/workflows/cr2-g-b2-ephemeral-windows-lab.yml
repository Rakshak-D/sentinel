name: CR2-G-B2 ephemeral Windows service lab

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  isolated-service-lab:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/cr2-g-b2-windows-ephemeral-lab' &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out reviewed feature head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true

      - name: Select Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Run disposable LocalService isolation lab
        shell: pwsh
        run: >-
          ./tools/cr2_g_b1/run_ephemeral_lab.ps1
          -EventPath $env:GITHUB_EVENT_PATH
