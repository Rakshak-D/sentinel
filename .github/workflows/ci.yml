name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      FORCE_COLOR: ""
      NO_COLOR: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python 3.11.7
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.7"

      - name: Create isolated Python environment
        shell: pwsh
        run: python -m venv .venv-ci

      - name: Verify Python base and virtual environment
        shell: pwsh
        run: |
          $python = ".\.venv-ci\Scripts\python.exe"
          & $python -c "from pathlib import Path; import struct, sys; assert sys.version_info[:3] == (3, 11, 7), sys.version; assert sys.prefix != sys.base_prefix, 'expected a virtual environment'; assert (Path(sys.base_prefix) / 'python.exe').is_file(), 'base interpreter path is missing'; assert struct.calcsize('P') * 8 == 64, 'expected 64-bit Python'; print(f'venv={sys.executable}'); print(f'base={sys.base_prefix}'); print(f'version={sys.version.split()[0]}')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install project and development dependencies
        shell: pwsh
        run: .\.venv-ci\Scripts\python.exe -m pip install -e ".[dev]"

      - name: Verify installed CLI location and version
        shell: pwsh
        run: |
          $python = ".\.venv-ci\Scripts\python.exe"
          $cli = ".\.venv-ci\Scripts\sentinel.exe"
          & $python -c "from pathlib import Path; import sys; script = Path(sys.executable).with_name('sentinel.exe'); assert script.is_file(), 'Sentinel console script is missing beside the virtual-environment interpreter'; print(f'console_script={script}')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath $cli -PathType Leaf)) { throw 'Sentinel console script is missing beside the virtual-environment interpreter' }
          $version = (& $cli version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne "0.3.0.dev0") { throw 'Sentinel CLI version did not match 0.3.0.dev0' }
          Write-Output "Sentinel CLI version: $version"

      - name: Check installed dependencies
        shell: pwsh
        run: .\.venv-ci\Scripts\python.exe -m pip check

      - name: Run Ruff
        shell: pwsh
        run: .\.venv-ci\Scripts\python.exe -m ruff check .

      - name: Run strict mypy
        shell: pwsh
        run: .\.venv-ci\Scripts\python.exe -m mypy src/sentinel

      - name: Run tests
        shell: pwsh
        run: .\.venv-ci\Scripts\python.exe -m pytest -q
