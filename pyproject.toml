[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.2.0.dev0"
description = "Local-first personal automation project bootstrap"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2,<3",
    "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2.0",
    "mypy>=1.11,<2.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.8,<1.0",
]

[project.scripts]
sentinel = "sentinel.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sentinel.demo" = ["fixtures/*.json"]
"sentinel.readers" = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src/sentinel"]
strict = true
warn_unreachable = true
show_error_codes = true
